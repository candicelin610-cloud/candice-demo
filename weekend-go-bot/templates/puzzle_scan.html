<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掃碼解鎖 — Weekend GO！</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- html5-qrcode：純 JS QR 掃碼，支援手機相機 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FFFDE7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    h1 { font-size: 1.4rem; color: #5D4037; margin-bottom: 6px; }
    p.hint { font-size: 0.88rem; color: #8D6E63; margin-bottom: 20px; text-align: center; }

    #reader {
      width: 100%;
      max-width: 340px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    /* 已收集 / 錯誤的簡易提示 */
    #result {
      margin-top: 20px;
      width: 100%;
      max-width: 340px;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
    }
    #result.already { background: #FFE082; color: #795548; }
    #result.error   { background: #FFCDD2; color: #B71C1C; }
    #result .big { font-size: 2rem; margin-bottom: 6px; }
    #result .msg { font-weight: 700; margin-bottom: 4px; }
    #result .sub { font-size: 0.8rem; }

    /* 解鎖成功卡片 */
    #unlock-card {
      display: none;
      margin-top: 20px;
      width: 100%;
      max-width: 340px;
      background: #FFFBE0;
      border: 1.5px solid #EDD870;
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
    }
    .uc-top { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
    .uc-circle {
      width: 56px; height: 56px; border-radius: 50%;
      background: #F9C846;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 700; color: #5D4037;
    }
    .uc-title { font-size: 1.25rem; font-weight: 700; color: #5D4037; margin-top: 10px; }
    .uc-card {
      background: #FFFFFF; border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .uc-emoji { font-size: 3.5rem; line-height: 1.2; margin-bottom: 8px; }
    .uc-name  { font-size: 1.05rem; font-weight: 700; color: #5D4037; margin-bottom: 6px; }
    .uc-fact  { font-size: 0.81rem; color: #8A7A5C; line-height: 1.5; }
    .uc-capsule {
      display: inline-block; background: #F9C846; border-radius: 99px;
      padding: 7px 20px; font-size: 0.88rem; font-weight: 700; color: #5D4037;
    }

    .back-btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: #5D4037;
      color: #FFF9C4;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h1>📷 掃碼解鎖碎片</h1>
<p class="hint">將鏡頭對準景點 QR Code，自動辨識並解鎖拼圖碎片</p>

<div id="reader"></div>

<!-- 解鎖成功卡片 -->
<div id="unlock-card">
  <div class="uc-top">
    <div class="uc-circle">✓</div>
    <div class="uc-title" id="uc-title">解鎖成功！</div>
  </div>
  <div class="uc-card">
    <div class="uc-emoji" id="uc-emoji"></div>
    <div class="uc-name"  id="uc-name"></div>
    <div class="uc-fact"  id="uc-fact"></div>
  </div>
  <div class="uc-capsule" id="uc-capsule"></div>
</div>

<!-- 已收集 / 錯誤提示 -->
<div id="result"></div>

<a class="back-btn" id="back-btn" href="/puzzle?uid={{ user_id }}">← 返回拼圖進度</a>

<script>
  const LIFF_ID = "2010569072-Xzfs0jWO";
  const BOARD_LIFF_URL = "https://liff.line.me/2010569072-7YL42XMG";

  let USER_ID = "{{ user_id }}";  // LIFF 初始化前的 fallback
  let scanning = false;           // 等 LIFF init 完再開始掃

  // 先初始化 LIFF 取得真實 user ID，再啟動掃描器
  liff.init({ liffId: LIFF_ID }).then(() => {
    if (liff.isLoggedIn()) {
      return liff.getProfile();
    }
  }).then(profile => {
    if (profile) USER_ID = profile.userId;
  }).catch(err => {
    console.error("LIFF init error:", err);
  }).finally(() => {
    startScanner();
  });

  function startScanner() {
    scanning = true;
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },      // 優先使用後鏡頭
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => onScanSuccess(html5QrCode, decodedText),
      () => {}                            // 忽略掃描中的錯誤提示
    ).catch(err => showResult("error", "❌", "無法開啟相機", err.toString()));
  }

  async function onScanSuccess(html5QrCode, decodedText) {
    if (!scanning) return;
    scanning = false;                   // 避免重複送出

    // QR Code 格式期望：piece_id=<數字>（例如 piece_id=3）
    const match = decodedText.match(/piece_id=(\w+)/);
    const pieceId = match ? match[1] : decodedText.trim();

    try {
      const res = await fetch("/api/puzzle/checkin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: USER_ID, piece_id: pieceId }),
      });
      const data = await res.json();

      if (!data.ok) {
        showSimple("error", "❌", "這個 QR Code 無效", data.error || "");
        resumeScan();
      } else if (data.already_had) {
        showSimple("already", "🔄", "你已經來過這裡囉",
          `目前進度：${data.count} / ${data.total} 片`);
        resumeScan();
      } else {
        html5QrCode.stop();
        showUnlockCard(data.piece_emoji, data.piece_name, data.piece_fun_fact,
                       data.count, data.total);
      }
    } catch (e) {
      showSimple("error", "❌", "網路錯誤，請稍後再試", e.toString());
      resumeScan();
    }
  }

  function showUnlockCard(emoji, name, fact, count, total) {
    const isComplete = (count === total);
    document.getElementById("uc-title").textContent =
      isComplete ? "太厲害了！全部收集完成！" : "解鎖成功！";
    document.getElementById("result").style.display = "none";
    document.getElementById("uc-emoji").textContent   = emoji;
    document.getElementById("uc-name").textContent    = name;
    document.getElementById("uc-fact").textContent    = fact;
    document.getElementById("uc-capsule").textContent = `目前進度 ${count} / ${total}`;
    document.getElementById("unlock-card").style.display = "block";
  }

  function showSimple(type, icon, msg, sub) {
    document.getElementById("unlock-card").style.display = "none";
    const el = document.getElementById("result");
    el.className = type;
    el.style.display = "block";
    el.innerHTML = `<div class="big">${icon}</div><div class="msg">${msg}</div><div class="sub">${sub}</div>`;
  }

  function resumeScan() {
    setTimeout(() => {
      document.getElementById("result").style.display = "none";
      scanning = true;
    }, 2500);
  }
</script>

</body>
</html>
